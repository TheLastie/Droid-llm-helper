name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # для зеркалирования APK в ветку apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # НЕ использовать android-actions/setup-android - сломан на новых runner'ах
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # NDK 27+ (16KB-страницы) и CMake - явно, не надеемся на автоустановку AGP
      - name: Install NDK + CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # Keystore декодируется автоматически в app/build.gradle при сборке.
      # Проверим, что декодирование сработало:
      - name: Decode keystore
        run: |
          cd keystore
          tr -d '[:space:]' < debug.keystore.b64 | base64 -d > debug.keystore
          ls -la debug.keystore

      # rus-данные tesseract: кладём в assets перед сборкой (CI скачивает быстро,
      # в git 4 МБ не храним). Канал sandbox->GitHub для этого файла лежит.
      - name: Fetch tessdata
        run: |
          mkdir -p app/src/main/assets/tessdata
          mkdir -p app/src/main/assets/tessdata
          # из собственной ветки apk (ocr-deps положил туда). НЕ git checkout:
          # actions/checkout v4 - blobless-клон, файла другой ветки нет локально.
          curl -fSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -o app/src/main/assets/tessdata/rus.traineddata \
               "https://api.github.com/repos/${{ github.repository }}/contents/rus.traineddata?ref=apk"
          test "$(stat -c%s app/src/main/assets/tessdata/rus.traineddata)" = "3861738"
          sha256sum app/src/main/assets/tessdata/rus.traineddata

      # база знаний в assets (берём из собственной ветки apk)
      - name: Fetch KB into assets
        run: |
          mkdir -p app/src/main/assets
          curl -fSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -o app/src/main/assets/kb_base.zip \
               "https://api.github.com/repos/${{ github.repository }}/contents/offlineref_kb_base_v3.zip?ref=apk"
          ls -la app/src/main/assets/

      # страницы книг из частей (api не принимает >~50MB за раз)
      - name: Assemble book pages into assets
        run: |
          mkdir -p app/src/main/assets
          for i in $(seq -w 0 14); do
            curl -fSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.raw" \
                 -o "/tmp/bp.part$i" \
                 "https://api.github.com/repos/${{ github.repository }}/contents/bp.part$i?ref=apk"
          done
          cat $(ls /tmp/bp.part* | sort) > app/src/main/assets/book_pages.zip
          ls -la app/src/main/assets/

      - name: Build
        run: gradle assembleDebug --stacktrace

      # Правило 1: класс обязан быть в dex, иначе Kotlin не компилировался
      - name: Check MainActivity in dex
        run: python3 tools/check_dex.py

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/*.apk

      # Правило 2: уникальное имя на каждую сборку - никаких app-debug.apk
      - name: Rename with version
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk OfflineRef-v${{ github.run_number }}-b1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRef-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/OfflineRef-v${{ github.run_number }}-b1.apk

      # Зеркалируем APK в ветку apk - запасной канал доставки (raw.githubusercontent
      # доступен там, где artifacts-хранилище недоступно) + бэкап сборок
      - name: Mirror APK to apk branch (plumbing, no checkout)
        run: |
          APK=$(ls app/build/outputs/apk/debug/OfflineRef-*.apk)
          git config user.email "ci@offlineref.local"
          git config user.name "ci"
          # blobless-клон не тянет checkout чужой ветки с большими бинарниками.
          # Собираем коммит через plumbing: новый блоб -> дерево на базе старого
          # (с заменой только APK) -> коммит -> push. Остальные файлы ветки целы.
          git fetch origin apk
          BLOB=$(git hash-object -w "$APK")
          OLDTREE=$(git rev-parse origin/apk^{tree})
          NEWTREE=$(git mktree < <( (git ls-tree "$OLDTREE" | grep -v $'\t'OfflineRef-latest.apk; echo "100644 blob $BLOB"$'\t'OfflineRef-latest.apk) ))
          NEW=$(git commit-tree "$NEWTREE" -p origin/apk -m "APK build ${{ github.run_number }}")
          git push origin "$NEW:apk"
          echo "mirrored: $NEW" 
