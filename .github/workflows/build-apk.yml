name: build-apk-v2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # для зеркалирования APK в ветку apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # НЕ использовать android-actions/setup-android - сломан на новых runner'ах
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # NDK 27+ (16KB-страницы) и CMake - явно, не надеемся на автоустановку AGP
      - name: Install NDK + CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # Keystore декодируется автоматически в app/build.gradle при сборке.
      # Проверим, что декодирование сработало:
      - name: Decode keystore
        run: |
          cd keystore
          tr -d '[:space:]' < debug.keystore.b64 | base64 -d > debug.keystore
          ls -la debug.keystore

      - name: Build
        run: gradle assembleDebug --rerun-tasks --stacktrace

      # Правило 1: класс обязан быть в dex, иначе Kotlin не компилировался
      - name: Check MainActivity in dex
        run: python3 tools/check_dex.py

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/*.apk

      # Правило 2: уникальное имя на каждую сборку - никаких app-debug.apk
      - name: Rename with version
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk OfflineRef-v${{ github.run_number }}-b1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRef-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/OfflineRef-v${{ github.run_number }}-b1.apk

      # Зеркалируем APK в ветку apk - запасной канал доставки (raw.githubusercontent
      # доступен там, где artifacts-хранилище недоступно) + бэкап сборок
      - name: Mirror APK to apk branch (plumbing + retry on race)
        run: |
          APK=$(ls app/build/outputs/apk/debug/OfflineRef-*.apk)
          for attempt in 1 2 3; do
          git config user.email "ci@offlineref.local"
          git config user.name "ci"
          # blobless-клон не тянет checkout чужой ветки с большими бинарниками.
          # Собираем коммит через plumbing: новый блоб -> дерево на базе старого
          # (с заменой только APK) -> коммит -> push. Остальные файлы ветки целы.
          git fetch origin apk
          BLOB=$(git hash-object -w "$APK")
          OLDTREE=$(git rev-parse origin/apk^{tree})
          NEWTREE=$(git mktree < <( (git ls-tree "$OLDTREE" | grep -v $'\t'OfflineRef-latest.apk; echo "100644 blob $BLOB"$'\t'OfflineRef-latest.apk) ))
          NEW=$(git commit-tree "$NEWTREE" -p $(git rev-parse origin/apk) -m "APK build ${{ github.run_number }}")
          if git push origin "$NEW:apk"; then
            echo "mirrored: $NEW"
            break
          else
            echo "push rejected (гонка), обновляем и пробуем снова (попытка $attempt)"
            git fetch origin apk
          fi
          done
