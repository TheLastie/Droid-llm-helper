name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # для зеркалирования APK в ветку apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # НЕ использовать android-actions/setup-android - сломан на новых runner'ах
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # NDK 27+ (16KB-страницы) и CMake - явно, не надеемся на автоустановку AGP
      - name: Install NDK + CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # Keystore декодируется автоматически в app/build.gradle при сборке.
      # Проверим, что декодирование сработало:
      - name: Decode keystore
        run: |
          cd keystore
          tr -d '[:space:]' < debug.keystore.b64 | base64 -d > debug.keystore
          ls -la debug.keystore

      # rus-данные tesseract: кладём в assets перед сборкой (CI скачивает быстро,
      # в git 4 МБ не храним). Канал sandbox->GitHub для этого файла лежит.
      - name: Fetch tessdata
        run: |
          mkdir -p app/src/main/assets/tessdata
          mkdir -p app/src/main/assets/tessdata
          # берём из собственной ветки apk (ocr-deps положил туда) - внешний
          # raw.githubusercontent с раннера периодически отваливается
          git fetch origin apk
          git checkout origin/apk -- rus.traineddata
          mv rus.traineddata app/src/main/assets/tessdata/rus.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/rus.traineddata)" = "3861738"
          ls -la app/src/main/assets/tessdata/

      - name: Build
        run: gradle assembleDebug --stacktrace

      # Правило 1: класс обязан быть в dex, иначе Kotlin не компилировался
      - name: Check MainActivity in dex
        run: python3 tools/check_dex.py

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/*.apk

      # Правило 2: уникальное имя на каждую сборку - никаких app-debug.apk
      - name: Rename with version
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk OfflineRef-v${{ github.run_number }}-b1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRef-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/OfflineRef-v${{ github.run_number }}-b1.apk

      # Зеркалируем APK в ветку apk - запасной канал доставки (raw.githubusercontent
      # доступен там, где artifacts-хранилище недоступно) + бэкап сборок
      - name: Mirror APK to apk branch
        run: |
          APK=$(ls app/build/outputs/apk/debug/OfflineRef-*.apk)
          git config user.email "ci@offlineref.local"
          git config user.name "ci"
          git fetch origin apk 2>/dev/null && git checkout apk || git checkout --orphan apk
          cp "$APK" OfflineRef-latest.apk
          git add OfflineRef-latest.apk
          git commit -m "APK build ${{ github.run_number }}" || true
          git push origin apk
