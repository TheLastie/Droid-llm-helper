name: ocr-deps
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk
      - name: Download rus.traineddata (fast on runner)
        run: |
          curl -sSL -o rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata
          ls -la rus.traineddata
          sha256sum rus.traineddata
      - name: Commit to apk branch (whole + parts for sandbox)
        run: |
          git config user.email "ci@offlineref.local"
          git config user.name "ci"
          # целый файл - для CI-сборок; части по 600 КБ - sandbox забирает
          # через Contents API (тот умирает на ответах >~1.7 МБ)
          split -b 600000 -d rus.traineddata rus.part
          git add rus.traineddata rus.part*
          git commit -m "rus.traineddata + 600KB parts (sandbox channel is capped)" || true
          git push
