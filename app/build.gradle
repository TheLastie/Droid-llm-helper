plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.offlineref'
    compileSdk 34

    // NDK 27+: обязателен для 16KB-страниц памяти Android 15/16 (playbook 2).
    // Более старый NDK соберёт .so молча, но он не загрузится на устройстве.
    ndkVersion "27.0.12077973"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.offlineref"
        minSdk 26
        targetSdk 34
        versionCode 43
        versionName "0.18.8"
        ndk { abiFilters "arm64-v8a" }   // правило 2: только наш ABI, -30 МБ
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
            }
        }
    }

    // ФИКСИРОВАННЫЙ ключ (правило 6 playbook): декодируется из base64,
    // который лежит в репозитории. Иначе каждая CI-сборка = новый ключ =
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE у пользователя в поле.
    signingConfigs {
        debug {
            def ks = file("../keystore/debug.keystore")
            def b64 = file("../keystore/debug.keystore.b64")
            if (!ks.exists() && b64.exists()) {
                ks.setBytes(b64.text.replaceAll("\s", "").decodeBase64())
            }
            storeFile ks
            storePassword "offlineref"
            keyAlias "offlineref"
            keyPassword "offlineref"
        }
    }
    buildTypes {
        debug  { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug   // v1: один ключ на все сборки
            minifyEnabled false                  // включим позже (правило 7)
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true   // AGP 8: по умолчанию ВЫКЛЮЧЕН - BuildConfig не генерируется
    }

    compileOptions {                      // правило 1: иначе Inconsistent JVM-target
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }  // = extractNativeLibs, см. манифест
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Извлечение текста из PDF (offline, Java-порт PdfBox)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // OCR сканов на устройстве (tesseract 4, русский; данные кладёт CI в assets)
    implementation 'com.rmtheis:tess-two:9.1.0'
    // Шаг 1 (B1): намеренно МИНИМУМ зависимостей. Compose/ONNX/llama.cpp
    // добавляем отдельными шагами, чтобы бисекция (правило 4.5) работала.
}
