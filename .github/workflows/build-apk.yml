name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Decode keystore
        run: |
          cd keystore
          tr -d '[:space:]' < debug.keystore.b64 | base64 -d > debug.keystore

      # KB v3 (no cache)
      - name: Fetch KB v3
        run: |
          mkdir -p app/src/main/assets
          rm -f app/src/main/assets/kb_base.zip
          curl -fSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -o app/src/main/assets/kb_base.zip \
               "https://api.github.com/repos/${{ github.repository }}/contents/offlineref_kb_base_v3.zip?ref=apk"
          test "$(stat -c%s app/src/main/assets/kb_base.zip)" = "294606"

      - name: Fetch tessdata
        run: |
          mkdir -p app/src/main/assets/tessdata
          git fetch origin apk
          git checkout origin/apk -- rus.traineddata
          mv rus.traineddata app/src/main/assets/tessdata/rus.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/rus.traineddata)" = "3861738"

      - name: Assemble book pages
        run: |
          mkdir -p /tmp/bp_parts
          for i in $(seq -w 0 14); do
            for attempt in 1 2 3; do
              curl -fSL --retry 2 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                   -H "Accept: application/vnd.github.raw" \
                   -o "/tmp/bp_parts/bp.part$i" \
                   "https://api.github.com/repos/${{ github.repository }}/contents/bp.part$i?ref=apk" \
                && break || { echo "retry $i:$attempt"; sleep 2; }
            done
          done
          test $(ls /tmp/bp_parts/bp.part* | wc -l) -eq 15
          cat $(ls /tmp/bp_parts/bp.part* | sort) > app/src/main/assets/book_pages.zip
          test "$(stat -c%s app/src/main/assets/book_pages.zip)" -gt 30000000

      - name: Fetch species catalog
        run: |
          curl -fSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -o app/src/main/assets/species.json \
               "https://api.github.com/repos/${{ github.repository }}/contents/species.json?ref=apk"
          test "$(stat -c%s app/src/main/assets/species.json)" -gt 20000

      - name: Smoke test KB
        run: python3 tools/smoke_test.py

      - name: Self-test (5 layers)
        run: python3 tools/selftest.py

      - name: Invalidate assets task
        run: gradle :app:generateDebugAssets --rerun-tasks -x preBuild -x preDebugBuild || true

      - name: Build
        run: gradle assembleDebug --rerun-tasks --no-build-cache --stacktrace

      - name: Check MainActivity in dex
        run: python3 tools/check_dex.py

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/*.apk

      - name: Rename with version
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk OfflineRef-v${{ github.run_number }}-b1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineRef-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/OfflineRef-v${{ github.run_number }}-b1.apk

      - name: Mirror APK to apk branch (retry on race)
        run: |
          APK=$(ls app/build/outputs/apk/debug/OfflineRef-*.apk)
          git config user.email "ci@offlineref.local"
          git config user.name "ci"
          for attempt in 1 2 3; do
            git fetch origin apk
            BLOB=$(git hash-object -w "$APK")
            OLDTREE=$(git rev-parse origin/apk^{tree})
            NEWTREE=$(git mktree < <( (git ls-tree "$OLDTREE" | grep -v $'\t'OfflineRef-latest.apk; echo "100644 blob $BLOB"$'\t'OfflineRef-latest.apk) ))
            NEW=$(git commit-tree "$NEWTREE" -p $(git rev-parse origin/apk) -m "APK build ${{ github.run_number }}")
            if git push origin "$NEW:apk"; then
              echo "mirrored: $NEW"
              break
            else
              echo "retry $attempt"
              git fetch origin apk
            fi
          done
